[package]
name = "trading-bot-operator"
version = "0.1.0"
description = "trading_bot Operator (Tauri)"
authors = ["trading_bot"]
edition = "2021"

[lib]
name = "trading_bot_operator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Embed ui/web/out via asset protocol — native window, no localhost HTTP server.
# Without this, debug builds load devUrl (127.0.0.1:1420) inside WebView2.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
strip = true
