name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8"
      - name: Compile production modules
        run: python -m compileall -q engine/observability.py tools/healthcheck.py scripts/healthcheck.py
      - name: Run deterministic operations tests
        run: python -m pytest -q tests/test_observability.py tests/test_healthcheck.py
